# 8maki 夜のストーリー自動投稿（時刻はUTC。日本時間 = UTC+9）
#   ①19:00 → UTC 10:00 ／ ②24:30 → UTC 15:30 ／ ③27:00(翌3:00) → UTC 18:00
#   混雑で遅れやすいので数分早めに起動し、スクリプトが予定時刻まで待つ。月〜土の営業日だけ（UTCの曜日＝営業日の曜日）。
name: stories
on:
  schedule:
    - cron: "52 9 * * 1-6"
    - cron: "22 15 * * 1-6"
    - cron: "52 17 * * 1-6"
  workflow_dispatch:
    inputs:
      slot:
        description: "枠（auto=今の時刻から判断）"
        type: choice
        options: [auto, open, late, shijimi]
        default: auto
      dry_run:
        description: "下見だけ（投稿しない）"
        type: boolean
        default: true
      force:
        description: "時刻・曜日・重複のチェックを無視（テスト用）"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: stories
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ストーリーを投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SLOT: ${{ inputs.slot || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node stories/post.mjs
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "8maki-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain stories/log.csv)" ]; then
            git add stories/log.csv
            git commit -m "story log"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
